name: Production Deployment Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 3dprintcad/assistant
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Security and quality checks
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit semgrep
          pip install -r requirements.txt

      - name: Run safety check for known vulnerabilities
        run: safety check --json --output safety-report.json || true

      - name: Run bandit security linter
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Run Semgrep security analysis
        run: |
          python -m semgrep --config=auto --json --output=semgrep-report.json src/ || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            safety-report.json
            bandit-report.json
            semgrep-report.json

      - name: Run custom security scanner
        run: |
          python -m src.core.security_scanner || true

  # Code quality and testing
  test-and-quality:
    name: Test and Quality Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_web.txt
          pip install pytest pytest-cov pytest-asyncio black flake8 mypy

      - name: Code formatting check
        run: black --check --diff src/

      - name: Linting
        run: flake8 src/ --max-line-length=88 --extend-ignore=E203,W503

      - name: Type checking
        run: mypy src/ --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=src --cov-report=xml --cov-report=html --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Performance benchmarks
        run: |
          python scripts/performance_benchmark.py

  # Build and test Docker image
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [security-scan, test-and-quality]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Integration testing
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-image]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          docker-compose -f docker-compose.test.yml up -d --wait

      - name: Run integration tests
        run: |
          docker-compose -f docker-compose.test.yml exec -T app pytest tests/integration/ -v

      - name: Run API tests
        run: |
          docker-compose -f docker-compose.test.yml exec -T app pytest tests/api/ -v

      - name: Check application health
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done'

      - name: Load testing
        run: |
          docker run --rm --network host -v $PWD/tests:/tests \
            loadimpact/k6 run /tests/load/basic-load-test.js

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml down -v

  # Compliance validation
  compliance-check:
    name: Compliance Validation
    runs-on: ubuntu-latest
    needs: [build-image]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run compliance assessment
        run: |
          python -m src.core.compliance_manager

      - name: Validate SOC 2 compliance
        run: |
          python scripts/validate_soc2_compliance.py

      - name: Check GDPR compliance
        run: |
          python scripts/validate_gdpr_compliance.py

      - name: Upload compliance reports
        uses: actions/upload-artifact@v4
        with:
          name: compliance-reports
          path: compliance_reports/

  # Staging deployment
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [integration-test, compliance-check]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: ${{ vars.STAGING_APP_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name staging-cluster

      - name: Deploy to staging
        run: |
          helm upgrade --install 3dcad-staging ./helm/3dcad \
            --namespace staging \
            --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set environment=staging \
            --values ./helm/values-staging.yaml \
            --wait --timeout=10m

      - name: Run staging smoke tests
        run: |
          kubectl wait --for=condition=ready pod -l app=3dcad-assistant -n staging --timeout=300s
          python tests/smoke/staging_smoke_test.py

      - name: Update staging status
        run: |
          kubectl annotate deployment 3dcad-assistant -n staging \
            deployment.kubernetes.io/revision="$(date -u +%Y%m%d%H%M%S)"

  # Production deployment
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: ${{ vars.PRODUCTION_APP_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name production-cluster

      - name: Backup current deployment
        run: |
          kubectl get deployment 3dcad-assistant -n production -o yaml > backup-deployment.yaml
          aws s3 cp backup-deployment.yaml s3://3dcad-backups/deployments/$(date +%Y%m%d%H%M%S)/

      - name: Pre-deployment health check
        run: |
          python scripts/pre_deployment_check.py

      - name: Deploy to production (blue-green)
        run: |
          helm upgrade --install 3dcad-production ./helm/3dcad \
            --namespace production \
            --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set environment=production \
            --set deployment.strategy=blueGreen \
            --values ./helm/values-production.yaml \
            --wait --timeout=15m

      - name: Run production validation tests
        run: |
          kubectl wait --for=condition=ready pod -l app=3dcad-assistant -n production --timeout=300s
          python tests/smoke/production_validation.py

      - name: Update production DNS (complete blue-green switch)
        run: |
          kubectl patch service 3dcad-assistant-service -n production \
            -p '{"spec":{"selector":{"version":"$(git describe --tags --exact-match)"}}}'

      - name: Post-deployment monitoring
        run: |
          python scripts/post_deployment_monitor.py --duration=300

      - name: Send deployment notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          message: |
            🚀 Production deployment successful!
            Version: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Environment: ${{ vars.PRODUCTION_APP_URL }}

  # Security monitoring
  security-monitoring:
    name: Post-Deployment Security Monitoring
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always() && (needs.deploy-production.result == 'success' || needs.deploy-staging.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: '${{ vars.PRODUCTION_APP_URL }}'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Upload ZAP results
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: report_html.html

      - name: Start continuous security monitoring
        run: |
          python scripts/start_security_monitoring.py

  # Cleanup and notifications
  cleanup:
    name: Cleanup and Notifications
    runs-on: ubuntu-latest
    needs: [deploy-production, security-monitoring]
    if: always()
    steps:
      - name: Clean up staging environment
        if: success()
        run: |
          # Clean up old staging deployments
          kubectl delete deployment -l "version!=$(git describe --tags --exact-match)" -n staging || true

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-artifacts
          path: |
            backup-deployment.yaml
            compliance_reports/
            security-reports/
          retention-days: 30

      - name: Update deployment status
        if: always()
        run: |
          python scripts/update_deployment_status.py \
            --status="${{ job.status }}" \
            --version="${{ github.ref_name }}" \
            --commit="${{ github.sha }}"

      - name: Send summary notification
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          message: |
            📊 Deployment Pipeline Summary
            Status: ${{ job.status }}
            Version: ${{ github.ref_name }}
            Security Score: View artifacts
            Compliance: ✅ All checks passed
            Environment: Production ready