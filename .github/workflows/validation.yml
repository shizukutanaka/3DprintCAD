name: 3D Model Validation Pipeline

on:
  push:
    paths:
      - 'models/**/*.stl'
      - 'models/**/*.3mf'
      - 'models/**/*.obj'
      - '.github/workflows/validation.yml'
      - 'src/**'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'models/**/*.stl'
      - 'models/**/*.3mf'
      - 'models/**/*.obj'
      - 'src/**'
      - 'tests/**'

jobs:
  validate-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=xml 2>&1 | tee test-results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.txt

      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella-py${{ matrix.python-version }}

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit[toml] flake8 mypy

      - name: Run security scan (bandit)
        continue-on-error: true
        run: |
          bandit -r src/ -f json -o bandit-report.json 2>&1 || true
          echo "Security scan completed"

      - name: Run linting (flake8)
        continue-on-error: true
        run: |
          flake8 src/ tests/ --max-line-length=120 --exclude=__pycache__ 2>&1 | tee flake8-report.txt || true

      - name: Run type checking (mypy)
        continue-on-error: true
        run: |
          mypy src/ --ignore-missing-imports 2>&1 | tee mypy-report.txt || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            flake8-report.txt
            mypy-report.txt

  build-and-test:
    runs-on: ubuntu-latest
    needs: [validate-models]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build package
        run: |
          python setup.py sdist bdist_wheel

      - name: Test package installation
        run: |
          pip install dist/*.whl
          printcad --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  validation-status:
    runs-on: ubuntu-latest
    needs: [validate-models, security-scan, build-and-test]
    if: always()

    steps:
      - name: Check validation status
        run: |
          echo "Validation Pipeline Status"
          echo "=========================="
          echo "Unit Tests: ${{ needs.validate-models.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo "Build & Test: ${{ needs.build-and-test.result }}"

          if [ "${{ needs.validate-models.result }}" = "failure" ]; then
            echo "::error::Unit tests failed"
            exit 1
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const testResult = '${{ needs.validate-models.result }}';
            const securityResult = '${{ needs.security-scan.result }}';
            const buildResult = '${{ needs.build-and-test.result }}';

            const testIcon = testResult === 'success' ? '✅' : '❌';
            const securityIcon = securityResult === 'success' ? '✅' : '⚠️';
            const buildIcon = buildResult === 'success' ? '✅' : '❌';

            const comment = `## 3D Model Validation Results

            | Check | Status |
            |-------|--------|
            | Unit Tests | ${testIcon} ${testResult.toUpperCase()} |
            | Security Scan | ${securityIcon} ${securityResult.toUpperCase()} |
            | Build & Package | ${buildIcon} ${buildResult.toUpperCase()} |

            See workflow [run ${context.runId}](${context.payload.pull_request?.html_url}/checks) for details.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
