apiVersion: apps/v1
kind: Deployment
metadata:
  name: 3dcad-assistant
  namespace: 3dcad
  labels:
    app: 3dcad-assistant
    version: v2.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: 3dcad-assistant
  template:
    metadata:
      labels:
        app: 3dcad-assistant
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: 3dcad-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: app
        image: 3dprintcad/assistant:2.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: 3dcad-secrets
              key: secret-key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: 3dcad-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: 3dcad-secrets
              key: redis-url
        - name: ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: 3dcad-config
              key: allowed-origins
        - name: MAX_WORKERS
          valueFrom:
            configMapKeyRef:
              name: 3dcad-config
              key: max-workers
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: 3dcad-config
              key: log-level
        - name: ENABLE_MONITORING
          value: "true"
        - name: ENABLE_AUDIT
          value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: app-storage
          mountPath: /app/data
        - name: upload-storage
          mountPath: /app/uploads
        - name: log-storage
          mountPath: /app/logs
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: app-storage
        persistentVolumeClaim:
          claimName: 3dcad-app-pvc
      - name: upload-storage
        persistentVolumeClaim:
          claimName: 3dcad-upload-pvc
      - name: log-storage
        persistentVolumeClaim:
          claimName: 3dcad-log-pvc
      - name: config-volume
        configMap:
          name: 3dcad-config-files
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: 3dcad-assistant-service
  namespace: 3dcad
  labels:
    app: 3dcad-assistant
spec:
  type: ClusterIP
  selector:
    app: 3dcad-assistant
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 3dcad-assistant-ingress
  namespace: 3dcad
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - <production-domain>
    secretName: 3dcad-tls-secret
  rules:
  - host: <production-domain>
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: 3dcad-assistant-service
            port:
              number: 8080

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: 3dcad-config
  namespace: 3dcad
data:
  allowed-origins: "https://<production-domain>"
  max-workers: "8"
  log-level: "INFO"
  cache-size-mb: "1024"
  timeout-seconds: "300"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: 3dcad-config-files
  namespace: 3dcad
data:
  production.yaml: |
    app:
      environment: production
      debug: false
    security:
      max_file_size_mb: 500
    processing:
      max_workers: 8
      timeout_seconds: 300
    validation:
      min_wall_thickness: 0.4
      min_feature_size: 0.2
      max_overhang_angle: 45.0
    logging:
      level: INFO
      file_enabled: true
      max_file_size_mb: 50

---
apiVersion: v1
kind: Secret
metadata:
  name: 3dcad-secrets
  namespace: 3dcad
type: Opaque
stringData:
  secret-key: "REPLACE_WITH_SECURE_SECRET_KEY"
  database-url: "postgresql://user:password@postgres-service:5432/3dcad"
  redis-url: "redis://redis-service:6379/0"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: 3dcad-service-account
  namespace: 3dcad

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: 3dcad-app-pvc
  namespace: 3dcad
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: 3dcad-upload-pvc
  namespace: 3dcad
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: 3dcad-log-pvc
  namespace: 3dcad
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: 3dcad-assistant-pdb
  namespace: 3dcad
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: 3dcad-assistant

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: 3dcad-assistant-hpa
  namespace: 3dcad
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: 3dcad-assistant
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80